<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio Template">
  <title>Portfolio</title>
  
  <!-- Google Fonts: Inter & Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="#hero" class="nav-brand skeleton skeleton-text" id="nav-brand"></a>

      <nav id="nav-links" class="nav-links">
        <a href="#skills" class="nav-link skeleton skeleton-text" id="nav-skills"></a>
        <a href="#projects" class="nav-link skeleton skeleton-text" id="nav-projects"></a>
        <a href="#contact" class="nav-link skeleton skeleton-text" id="nav-contact"></a>
      </nav>

      <div class="nav-controls">
        <!-- Language Switcher Button -->
        <button id="lang-btn" class="control-btn lang-btn" onclick="window.switchLanguage()" aria-label="Switch Language" title="Switch Language">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span id="lang-btn-text" class="skeleton skeleton-text"></span>
        </button>

        <!-- Theme Toggle Button -->
        <button id="theme-toggle-btn" class="control-btn theme-toggle-btn" onclick="window.toggleTheme()" aria-label="Switch Theme" title="Switch Theme">
          <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
          <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>

        <!-- Mobile Menu Toggle Button -->
        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle navigation menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12"></line>
            <line x1="4" x2="20" y1="6" y2="6"></line>
            <line x1="4" x2="20" y1="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero Section -->
    <section id="hero" class="hero-section">
      <div class="container">
        <div class="hero-grid">
          <div class="hero-content">
            <div class="hero-badge">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m18 16 4-4-4-4"></path>
                <path d="m6 8-4 4 4 4"></path>
                <path d="m14.5 4-5 16"></path>
              </svg>
              <span id="hero-badge-text" class="skeleton skeleton-text"></span>
            </div>
            
            <h1 class="hero-title skeleton skeleton-title" id="hero-title"></h1>
            <p class="hero-subtitle skeleton skeleton-subtitle" id="hero-subtitle"></p>
            
            <p class="hero-desc skeleton skeleton-desc" id="hero-desc"></p>
            
            <div class="hero-actions">
              <a href="#projects" class="btn btn-primary skeleton skeleton-btn" id="hero-view-work"></a>
              <a href="#contact" class="btn btn-outline skeleton skeleton-btn" id="hero-get-in-touch"></a>
            </div>

            <div class="hero-socials">
              <a href="https://github.com/Asemnajee" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="GitHub Profile">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
                  <path d="M9 18c-4.51 2-5-2-7-2"></path>
                </svg>
              </a>
              <a href="https://www.linkedin.com/in/asemnajee" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="LinkedIn Profile">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                  <rect width="4" height="12" x="2" y="9"></rect>
                  <circle cx="4" cy="4" r="2"></circle>
                </svg>
              </a>
              <a href="https://t.me/AsemNajee" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Telegram Channel">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </a>
              <a href="mailto:asem.a.najee@gmail.com" class="social-btn" aria-label="Send Email">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
              </a>
            </div>
          </div>

          <div class="hero-illustration">
            <div class="hero-img-wrapper">
              <img id="hero-img" src="" alt="Avatar" class="hero-img skeleton">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Technical Skills Section -->
    <section id="skills" class="section section-alt">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title skeleton skeleton-title" id="skills-title"></h2>
          <p class="section-desc skeleton skeleton-desc" id="skills-desc"></p>
        </div>

        <div class="skills-grid" id="skills-grid">
          <div class="skeleton-card skeleton"></div>
          <div class="skeleton-card skeleton"></div>
          <div class="skeleton-card skeleton"></div>
        </div>
      </div>
    </section>

    <!-- Featured Projects Section -->
    <section id="projects" class="section">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title skeleton skeleton-title" id="projects-title"></h2>
          <p class="section-desc skeleton skeleton-desc" id="projects-desc"></p>
        </div>

        <div class="projects-wrapper" id="projects-wrapper">
          <div class="skeleton-card skeleton"></div>
          <div class="skeleton-card skeleton"></div>
        </div>
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section section-alt">
      <div class="container">
        <div class="contact-card">
          <div class="section-header">
            <h2 class="section-title skeleton skeleton-title" id="contact-title"></h2>
            <p class="section-desc skeleton skeleton-desc" id="contact-desc"></p>
          </div>

          <div class="contact-actions">
            <a class="btn btn-primary skeleton skeleton-btn" id="contact-email-btn"></a>
            <a class="btn btn-outline skeleton skeleton-btn" id="contact-github-btn"></a>
          </div>

          <div class="contact-socials">
            <a href="https://github.com/Asemnajee" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="GitHub Profile">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
                <path d="M9 18c-4.51 2-5-2-7-2"></path>
              </svg>
            </a>
            <a href="https://www.linkedin.com/in/asemnajee" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="LinkedIn Profile">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                <rect width="4" height="12" x="2" y="9"></rect>
                <circle cx="4" cy="4" r="2"></circle>
              </svg>
            </a>
            <a href="https://t.me/AsemNajee" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Telegram Channel">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </a>
            <a href="mailto:asem.a.najee@gmail.com" class="social-btn" aria-label="Email Address">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer-text">
        &copy; <span id="current-year"></span> <span id="footer-author" class="skeleton skeleton-text"></span>. <span id="footer-copyright" class="skeleton skeleton-text"></span>
      </p>
    </div>
  </footer>

  <!-- Scripts: Data Fallback + Template Engine -->
  <script src="js/i18n-data.js?v=4"></script>
  <script src="js/main.js?v=4" defer></script>
</body>
</html>
